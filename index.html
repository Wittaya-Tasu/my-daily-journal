<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasuya Daily Journal V3.1</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --mood-1: #ff4d4d; --mood-2: #ff944d; --mood-3: #ffdb4d; --mood-4: #c2f04d; --mood-5: #4df05d;
            --primary: #2c3e50; --bg: #f0f2f5; --white: #ffffff;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #capture-area { background: var(--white); width: 100%; max-width: 500px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        header { border-bottom: 2px solid #eee; margin-bottom: 15px; padding-bottom: 10px; }
        header h2 { margin: 0; color: var(--primary); font-size: 1.3rem; }
        .star-rating { font-size: 1.8rem; color: #ddd; cursor: pointer; margin-top: 5px; letter-spacing: 5px; }
        .star-rating .active { color: #f1c40f; }

        h3 { font-size: 0.8rem; color: #888; text-transform: uppercase; margin: 18px 0 8px 0; border-left: 3px solid var(--primary); padding-left: 8px; font-weight: bold; }

        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }

        /* Mood & Water */
        .mood-btn { border: none; border-radius: 10px; cursor: pointer; font-size: 1.3rem; padding: 10px 0; flex: 1; opacity: 0.3; transition: 0.3s; }
        .mood-btn.active { opacity: 1; transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.15); border: 2px solid #333; }
        .water-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .water-btn { background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; cursor: pointer; font-size: 1rem; padding: 5px 0; }
        .water-btn.active { background: #e3f2fd; border-color: #2196f3; box-shadow: inset 0 0 5px rgba(33,150,243,0.2); }

        /* Nutrition & Meals */
        .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: #f8f9fa; border: 1px solid #ddd; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        .nutrition-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .nutri-item { display: flex; align-items: center; background: #f8f9fa; padding: 6px 10px; border-radius: 10px; font-size: 0.85rem; justify-content: space-between; border: 1px solid #eee; }
        .nutri-controls { display: flex; align-items: center; gap: 6px; }
        .nutri-count-btn { background: var(--primary); color: white; border: none; border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-weight: bold; font-size: 1rem; line-height: 1; }
        .nutri-count-btn.minus { background: #e74c3c; }

        /* Quick Tasks (Left Aligned) */
        .task-container { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
        .task-chip { background: #f1f1f1; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; }
        .task-chip.active { background: var(--primary); color: white; }
        .del-task { margin-left: 8px; color: #ff4d4d; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .add-task-wrap { display: flex; gap: 5px; margin-top: 8px; width: 100%; }
        .add-task-wrap input { flex: 1; font-size: 0.75rem; padding: 5px; border: 1px solid #ddd; border-radius: 5px; }

        /* Todo List */
        .todo-input-wrap { display: flex; gap: 5px; margin-bottom: 10px; }
        .todo-list-display { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .todo-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid #eee; }
        .todo-item.done span { text-decoration: line-through; color: #bbb; }
        .del-todo { margin-left: auto; color: #e74c3c; cursor: pointer; background: none; border: none; font-size: 1.1rem; }

        textarea { width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 0.9rem; box-sizing: border-box; margin-top: 10px; outline: none; }
        
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 12px; }
        .btn-save { background: #27ae60; color: white; }
        #loading { display: none; text-align: center; color: #666; font-size: 0.9rem; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="capture-area">
    <header>
        <h2 id="disp-date">Journal: -</h2>
        <div class="star-rating" id="star-row">
            <span onclick="setStars(1)">☆</span><span onclick="setStars(2)">☆</span><span onclick="setStars(3)">☆</span><span onclick="setStars(4)">☆</span><span onclick="setStars(5)">☆</span>
        </div>
    </header>

    <div class="row">
        <div class="col">
            <h3>Mood Rating</h3>
            <div style="display:flex; gap:5px;" id="mood-group">
                <button class="mood-btn" style="background:var(--mood-1)" onclick="setMood(1)">😡</button>
                <button class="mood-btn" style="background:var(--mood-2)" onclick="setMood(2)">🙁</button>
                <button class="mood-btn" style="background:var(--mood-3)" onclick="setMood(3)">😐</button>
                <button class="mood-btn" style="background:var(--mood-4)" onclick="setMood(4)">🙂</button>
                <button class="mood-btn" style="background:var(--mood-5)" onclick="setMood(5)">😄</button>
            </div>
        </div>
        <div class="col">
            <h3>Water <span id="water-liters" style="color:#2196f3">(0.00 L)</span></h3>
            <div class="water-grid" id="water-grid"></div>
        </div>
    </div>

    <h3>Nutrition & Meals</h3>
    <div class="chip-group" id="meal-group"></div>
    <div class="nutrition-grid" id="nutri-grid"></div>

    <h3>Supplements</h3>
    <div class="chip-group" id="supp-group"></div>

    <div class="row" style="margin-top:10px;">
        <div class="col">
            <h3>Work</h3>
            <div class="task-container" id="work-tasks"></div>
            <div class="add-task-wrap">
                <input type="text" id="in-work" placeholder="เพิ่มงาน...">
                <button class="nutri-count-btn" onclick="addTask('work-tasks', 'in-work')">+</button>
            </div>
        </div>
        <div class="col">
            <h3>Personal</h3>
            <div class="task-container" id="pers-tasks"></div>
            <div class="add-task-wrap">
                <input type="text" id="in-pers" placeholder="เรื่องส่วนตัว...">
                <button class="nutri-count-btn" onclick="addTask('pers-tasks', 'in-pers')">+</button>
            </div>
        </div>
    </div>

    <h3>Todo List</h3>
    <div class="todo-input-wrap">
        <input type="text" id="todo-in" placeholder="พิมพ์สิ่งที่ต้องทำวันนี้...">
        <button class="nutri-count-btn" style="width: 40px;" onclick="addTodo()">+</button>
    </div>
    <div id="todo-list" class="todo-list-display"></div>

    <h3>Daily Note</h3>
    <textarea id="daily-note" rows="3" placeholder="บันทึกสั้นๆ ของวันนี้..." oninput="saveLocal()"></textarea>

    <div class="actions">
        <button class="btn btn-save" onclick="processAll()">🚀 Save to Sheets & Drive</button>
        <div id="loading">⏳ กำลังบันทึกและซิงค์ข้อมูล...</div>
    </div>
</div>

<script>
    // --- 1. ใส่ URL เว็บแอปของคุณที่นี่ ---
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykttagm0Ec-gPhLUSXvD_HDQp0ZMh83ZX0s1zDs-KFBp1TEHn551B2QnKdRKFmeK-6/exec';

    let state = {
        stars: 0, mood: 3, water: 0, note: "",
        meals: { "🍳 Breakfast":false, "🍱 Lunch":false, "🍽️ Dinner":false, "🌙 Night":false },
        nutri: { "🥗 Carbo":0, "🥩 Protein":0, "🥑 GoodFat":0, "🥦 Veg-Fruit":0, "🍔 Junk":0, "🍰 Sweet":0, "🍟 Fried":0 },
        supps: { "💊 Omega3":false, "🧬 Iron":false, "🥛 Whey":false },
        workTasks: ['Farm Visit', 'Meeting', 'Lab Result', 'Slide-PPT', 'Drug Approve'],
        persTasks: ['Exercise', 'Reading', 'Meditation', 'Family', 'Hobby'],
        activeTasks: [],
        todos: []
    };

    // --- Local Storage Logic ---
    function saveLocal() {
        state.note = document.getElementById('daily-note').value;
        state.activeTasks = Array.from(document.querySelectorAll('.task-chip.active')).map(c => c.dataset.val);
        state.todos = Array.from(document.querySelectorAll('.todo-item')).map(t => ({
            text: t.querySelector('span').innerText,
            done: t.querySelector('input').checked
        }));
        localStorage.setItem('tasuya_v2_storage', JSON.stringify(state));
    }

    function loadLocal() {
        const saved = localStorage.getItem('tasuya_v2_storage');
        if(saved) state = JSON.parse(saved);
        renderUI();
    }

    // --- Rendering UI ---
    function renderUI() {
        document.getElementById('disp-date').innerText = "Journal: " + new Date().toLocaleDateString('th-TH');
        updateStarsUI();
        updateMoodUI();
        updateWaterUI();
        renderToggleGroup('meal-group', state.meals, 'meals');
        renderToggleGroup('supp-group', state.supps, 'supps');
        renderNutriUI();
        renderTasksUI('work-tasks', state.workTasks);
        renderTasksUI('pers-tasks', state.persTasks);
        document.getElementById('daily-note').value = state.note;
        const tl = document.getElementById('todo-list');
        tl.innerHTML = '';
        state.todos.forEach(t => renderTodoItem(t.text, t.done));
    }

    function updateStarsUI() {
        const stars = document.getElementById('star-row').children;
        for(let i=0; i<5; i++) {
            stars[i].innerText = i < state.stars ? '★' : '☆';
            stars[i].className = i < state.stars ? 'active' : '';
        }
    }
    function setStars(n) { state.stars = n; updateStarsUI(); saveLocal(); }

    function updateMoodUI() {
        const btns = document.getElementById('mood-group').children;
        for(let i=0; i<5; i++) btns[i].classList.toggle('active', (i+1)===state.mood);
    }
    function setMood(n) { state.mood = n; updateMoodUI(); saveLocal(); }

    function updateWaterUI() {
        document.getElementById('water-liters').innerText = `(${(state.water * 0.25).toFixed(2)} L)`;
        const grid = document.getElementById('water-grid');
        grid.innerHTML = '';
        for(let i=1; i<=10; i++) {
            let b = document.createElement('button');
            b.className = 'water-btn' + (i <= state.water ? ' active' : '');
            b.innerHTML = '🥛';
            b.onclick = () => { state.water = i; updateWaterUI(); saveLocal(); };
            grid.appendChild(b);
        }
    }

    function renderToggleGroup(id, obj, key) {
        const container = document.getElementById(id);
        container.innerHTML = '';
        for(let name in obj) {
            let s = document.createElement('span');
            s.className = 'chip' + (obj[name] ? ' active' : '');
            s.innerText = name;
            s.onclick = () => { state[key][name] = !state[key][name]; renderToggleGroup(id, obj, key); saveLocal(); };
            container.appendChild(s);
        }
    }

    function renderNutriUI() {
        const container = document.getElementById('nutri-grid');
        container.innerHTML = '';
        for(let name in state.nutri) {
            let d = document.createElement('div');
            d.className = 'nutri-item';
            
            // เพิ่มปุ่มลบ (-) และปุ่มเพิ่ม (+)
            d.innerHTML = `
                <span>${name}</span>
                <div class="nutri-controls">
                    <button class="nutri-count-btn minus" onclick="updateNutri('${name}', -1)">-</button>
                    <b>${state.nutri[name]}</b>
                    <button class="nutri-count-btn" onclick="updateNutri('${name}', 1)">+</button>
                </div>
            `;
            container.appendChild(d);
        }
    }

    // ฟังก์ชันอัปเดตค่า Nutrition (ป้องกันค่าติดลบ)
    function updateNutri(name, delta) { 
        state.nutri[name] += delta;
        if (state.nutri[name] < 0) state.nutri[name] = 0; // ห้ามลดต่ำกว่า 0
        renderNutriUI(); 
        saveLocal(); 
    }

    function renderTasksUI(id, list) {
        const container = document.getElementById(id);
        container.innerHTML = '';
        list.forEach((name, idx) => {
            let s = document.createElement('span');
            s.className = 'task-chip' + (state.activeTasks.includes(name) ? ' active' : '');
            s.dataset.val = name;
            s.innerHTML = `${name}<i class="del-task" onclick="removeTask('${id}', ${idx}); event.stopPropagation();">×</i>`;
            s.onclick = () => {
                if(state.activeTasks.includes(name)) state.activeTasks = state.activeTasks.filter(x => x !== name);
                else state.activeTasks.push(name);
                renderTasksUI(id, list); saveLocal();
            };
            container.appendChild(s);
        });
    }

    function addTask(id, inputId) {
        const input = document.getElementById(inputId);
        if(!input.value) return;
        if(id === 'work-tasks') state.workTasks.push(input.value);
        else state.persTasks.push(input.value);
        input.value = '';
        renderUI(); saveLocal();
    }
    function removeTask(id, idx) {
        if(id === 'work-tasks') state.workTasks.splice(idx, 1);
        else state.persTasks.splice(idx, 1);
        renderUI(); saveLocal();
    }

    function addTodo() {
        const input = document.getElementById('todo-in');
        if(!input.value) return;
        renderTodoItem(input.value, false);
        input.value = '';
        saveLocal();
    }
    function renderTodoItem(text, done) {
        const div = document.createElement('div');
        div.className = 'todo-item' + (done ? ' done' : '');
        div.innerHTML = `
            <input type="checkbox" ${done?'checked':''} onchange="this.parentElement.classList.toggle('done'); saveLocal();">
            <span>${text}</span>
            <button class="del-todo" onclick="this.parentElement.remove(); saveLocal();">×</button>
        `;
        document.getElementById('todo-list').appendChild(div);
    }

    // --- บันทึกข้อมูล ---
    async function processAll() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';
        window.scrollTo(0,0);

        const canvas = await html2canvas(document.getElementById('capture-area'), { scale: 2, useCORS: true });
        const base64Img = canvas.toDataURL("image/png");

        const now = new Date();
        const timestamp = now.getFullYear() + 
            String(now.getMonth() + 1).padStart(2, '0') + 
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') + 
            String(now.getMinutes()).padStart(2, '0');

        const payload = {
            date: now.toLocaleDateString('th-TH'),
            stars: state.stars,
            mood: state.mood,
            water: (state.water * 0.25).toFixed(2),
            meals: Object.entries(state.meals).filter(([k,v]) => v).map(([k,v]) => k).join(', '),
            nutrition: JSON.stringify(state.nutri),
            supps: Object.entries(state.supps).filter(([k,v]) => v).map(([k,v]) => k).join(', '),
            tasks: state.activeTasks.join(', '),
            todoList: Array.from(document.querySelectorAll('.todo-item')).map(t => (t.querySelector('input').checked ? '[x] ':'[ ] ') + t.querySelector('span').innerText).join(', '),
            note: document.getElementById('daily-note').value,
            image: base64Img,
            fileName: `Tasuya_Daily_Journal_${timestamp}`
        };

        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert('✅ บันทึกเรียบร้อย! ข้อมูลจะถูกล้างเพื่อเริ่มวันใหม่');
            localStorage.removeItem('tasuya_v2_storage');
            location.reload();
        } catch (e) {
            alert('❌ ผิดพลาด: ' + e);
        } finally {
            loading.style.display = 'none';
        }
    }

    loadLocal();
</script>

</body>
</html>
