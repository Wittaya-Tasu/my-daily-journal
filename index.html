<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasuya Daily Journal</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --mood-1: #ff4d4d; --mood-2: #ff944d; --mood-3: #ffdb4d; --mood-4: #c2f04d; --mood-5: #4df05d;
            --primary: #2c3e50; --bg: #f0f2f5; --white: #ffffff;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        
        /* พื้นที่หลักที่ต้องการแคปภาพ */
        #capture-area { 
            background: var(--white); 
            width: 100%; 
            max-width: 480px; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        header { border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        header h2 { margin: 0; color: var(--primary); font-size: 1.4rem; }
        header p { margin: 5px 0 0; color: #888; font-size: 0.9rem; }

        /* Mood & Water Section */
        .status-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .status-card { flex: 1; }
        h3 { font-size: 0.85rem; color: #666; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }

        .mood-group { display: flex; gap: 6px; }
        .mood-btn { border: none; border-radius: 10px; cursor: pointer; font-size: 1.3rem; padding: 10px 0; flex: 1; opacity: 0.3; transition: 0.2s; }
        .mood-btn.active { opacity: 1; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #333; }

        .water-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .water-btn { background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; cursor: pointer; font-size: 1.1rem; padding: 5px 0; transition: 0.2s; }
        .water-btn.active { background: #e3f2fd; border-color: #2196f3; box-shadow: inset 0 0 5px rgba(33,150,243,0.2); }

        /* Two Column Layout */
        .columns { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }

        /* Todo List */
        .todo-container { background: #f8f9fa; padding: 12px; border-radius: 12px; min-height: 100px; }
        .todo-input-wrap { display: flex; gap: 5px; margin-bottom: 10px; }
        input[type="text"] { flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-size: 0.9rem; outline: none; }
        .add-btn { background: var(--primary); color: white; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer; }
        .todo-list-display { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .todo-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; background: white; padding: 5px; border-radius: 4px; border: 1px solid #eee; }
        .todo-item.done span { text-decoration: line-through; color: #bbb; }

        /* Quick Tasks (Work/Personal) */
        .task-card { background: #f8f9fa; padding: 12px; border-radius: 12px; height: 100%; box-sizing: border-box; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: white; border: 1px solid #ddd; padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        textarea { width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 0.9rem; box-sizing: border-box; margin-top: 10px; outline: none; }

        /* Buttons & Loading */
        .actions { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-save { background: #27ae60; color: white; }
        .btn-save:hover { background: #219150; }
        .btn-img { background: #3498db; color: white; }
        #loading-overlay { display: none; text-align: center; color: #666; font-size: 0.9rem; padding: 10px; }
    </style>
</head>
<body>

<div id="capture-area">
    <header>
        <h2 id="display-date">Tasuya Daily Journal</h2>
        <p id="display-time">Ready to log your day</p>
    </header>

    <div class="status-row">
        <div class="status-card">
            <h3>Mood Rating</h3>
            <div class="mood-group">
                <button class="mood-btn" style="background:var(--mood-1)" onclick="setMood(1)">😡</button>
                <button class="mood-btn" style="background:var(--mood-2)" onclick="setMood(2)">🙁</button>
                <button class="mood-btn" style="background:var(--mood-3)" onclick="setMood(3)">😐</button>
                <button class="mood-btn" style="background:var(--mood-4)" onclick="setMood(4)">🙂</button>
                <button class="mood-btn" style="background:var(--mood-5)" onclick="setMood(5)">😄</button>
            </div>
        </div>
        <div class="status-card">
            <h3>Water (10)</h3>
            <div class="water-grid" id="water-grid"></div>
        </div>
    </div>

    <div class="columns">
        <div class="col">
            <div class="todo-container">
                <h3>Todo List</h3>
                <div class="todo-input-wrap">
                    <input type="text" id="todo-input" placeholder="What's next?">
                    <button class="add-btn" onclick="addTodo()">+</button>
                </div>
                <div id="todo-list" class="todo-list-display"></div>
            </div>
        </div>
    </div>

    <div class="columns">
        <div class="col">
            <div class="task-card">
                <h3>Work</h3>
                <div class="chip-group" id="work-tasks"></div>
            </div>
        </div>
        <div class="col">
            <div class="task-card">
                <h3>Personal</h3>
                <div class="chip-group" id="personal-tasks"></div>
            </div>
        </div>
    </div>

    <h3>Daily Note</h3>
    <textarea id="daily-note" rows="3" placeholder="How was your day? (Short note)"></textarea>

    <div class="actions">
        <button class="btn btn-save" onclick="processEntry()">🚀 Save to Sheets & Drive</button>
        <button class="btn btn-img" onclick="manualDownload()">📸 Download Image</button>
        <div id="loading-overlay">⏳ Processing and Syncing...</div>
    </div>
</div>

<script>
    // --- ตั้งค่า URL ของคุณที่นี่ ---
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykttagm0Ec-gPhLUSXvD_HDQp0ZMh83ZX0s1zDs-KFBp1TEHn551B2QnKdRKFmeK-6/exec';
    
    let currentMood = 3;
    let waterCount = 0;
    const workTags = ['Farm Visit', 'Meeting', 'Lab Result', 'Slide', 'Drug Approve'];
    const personalTags = ['Exercise', 'Reading', 'Meditation', 'Family', 'Hobby'];

    // Initial Setup
    document.getElementById('display-date').innerText = "Journal: " + new Date().toLocaleDateString('th-TH');
    
    // สร้าง Water Grid
    const wg = document.getElementById('water-grid');
    for(let i=1; i<=10; i++) {
        let btn = document.createElement('button');
        btn.className = 'water-btn'; btn.innerHTML = '🥛';
        btn.onclick = () => {
            waterCount = i;
            document.querySelectorAll('.water-btn').forEach((b, idx) => b.classList.toggle('active', idx < i));
        };
        wg.appendChild(btn);
    }

    // สร้างปุ่ม Chip
    function setupChips(id, list) {
        const container = document.getElementById(id);
        list.forEach(item => {
            let s = document.createElement('span');
            s.className = 'chip'; s.innerText = item;
            s.onclick = () => s.classList.toggle('active');
            container.appendChild(s);
        });
    }
    setupChips('work-tasks', workTags);
    setupChips('personal-tasks', personalTags);

    function setMood(val) {
        currentMood = val;
        document.querySelectorAll('.mood-btn').forEach((b, i) => b.classList.toggle('active', (i+1) === val));
    }
    setMood(3); // Default

    function addTodo() {
        const inp = document.getElementById('todo-input');
        if(!inp.value) return;
        const div = document.createElement('div');
        div.className = 'todo-item';
        div.innerHTML = `<input type="checkbox" onchange="this.parentElement.classList.toggle('done')"> <span>${inp.value}</span>`;
        document.getElementById('todo-list').appendChild(div);
        inp.value = '';
    }

    async function processEntry() {
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'block';
        
        // 1. แคปภาพ (ตามสเปก)
        window.scrollTo(0,0);
        const canvas = await html2canvas(document.getElementById('capture-area'), {
            useCORS: true, scale: 2, backgroundColor: "#ffffff"
        });
        const base64Image = canvas.toDataURL("image/png");

        // 2. รวบรวมข้อมูล
        const now = new Date();
        const timestamp = now.getFullYear() + 
            String(now.getMonth() + 1).padStart(2, '0') + 
            String(now.getDate()).padStart(2, '0') + "_" +
            String(now.getHours()).padStart(2, '0') + 
            String(now.getMinutes()).padStart(2, '0');
        
        const fileName = `Tasuya_Daily_Journal_${timestamp}`;
        
        const payload = {
            date: now.toLocaleDateString('th-TH'),
            moodRating: currentMood,
            water: waterCount,
            todoList: Array.from(document.querySelectorAll('.todo-item')).map(t => (t.querySelector('input').checked ? '[x] ':'[ ] ') + t.querySelector('span').innerText).join(', '),
            quickTasks: `Work: ${Array.from(document.querySelectorAll('#work-tasks .active')).map(c => c.innerText).join(',')} | Personal: ${Array.from(document.querySelectorAll('#personal-tasks .active')).map(c => c.innerText).join(',')}`,
            note: document.getElementById('daily-note').value,
            image: base64Image,
            fileName: fileName
        };

        // 3. ส่งข้อมูลไป Google Apps Script
        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            });
            alert('✅ บันทึกข้อมูลและรูปภาพเรียบร้อยแล้ว!');
            location.reload(); // เคลียร์ฟอร์ม
        } catch (e) {
            alert('❌ เกิดข้อผิดพลาด: ' + e);
        } finally {
            loader.style.display = 'none';
        }
    }

    async function manualDownload() {
        window.scrollTo(0,0);
        const canvas = await html2canvas(document.getElementById('capture-area'), {
            useCORS: true, scale: 2, backgroundColor: "#ffffff"
        });
        const link = document.createElement('a');
        link.download = `Tasuya_Journal_Manual_${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
</script>

</body>
</html>
